<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .eye { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
    .arm-wave { animation: wave 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 15% 85%; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-28deg); } }
    @media (prefers-reduced-motion: reduce) { .eye, .arm-wave { animation: none; } }
  </style>
  <defs>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFD0E2"/>
      <stop offset="0.55" stop-color="#FFA3C6"/>
      <stop offset="1" stop-color="#F57FAE"/>
    </radialGradient>
  </defs>
  <g stroke="#3B2A5C" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="62" cy="171" rx="34" ry="17" transform="rotate(-12 62 171)" fill="#E8375F"/>
    <ellipse cx="138" cy="171" rx="34" ry="17" transform="rotate(12 138 171)" fill="#E8375F"/>
    <ellipse cx="36" cy="120" rx="21" ry="17" fill="#FFA3C6"/>
    <g class="arm-wave"><ellipse cx="164" cy="86" rx="21" ry="17" transform="rotate(-35 164 86)" fill="#FFA3C6"/></g>
    <circle cx="100" cy="105" r="68" fill="url(#body)"/>
  </g>
  <g class="eye">
    <ellipse cx="86" cy="92" rx="8" ry="19" fill="#1F1640"/>
    <ellipse cx="86" cy="102" rx="5.5" ry="8" fill="#2F6BE0"/>
    <ellipse cx="86" cy="82" rx="4.5" ry="7.5" fill="#fff"/>
  </g>
  <g class="eye">
    <ellipse cx="114" cy="92" rx="8" ry="19" fill="#1F1640"/>
    <ellipse cx="114" cy="102" rx="5.5" ry="8" fill="#2F6BE0"/>
    <ellipse cx="114" cy="82" rx="4.5" ry="7.5" fill="#fff"/>
  </g>
  <ellipse cx="63" cy="116" rx="12" ry="6.5" fill="#FF5E95" opacity="0.55"/>
  <ellipse cx="137" cy="116" rx="12" ry="6.5" fill="#FF5E95" opacity="0.55"/>
  <path d="M91 121 Q100 136 109 121 Q100 125 91 121Z" fill="#B8174E" stroke="#3B2A5C" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
